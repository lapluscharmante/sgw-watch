name: Daily ShopGoodwill Search

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

concurrency:
  group: sgw-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python sgw_search.py --debug
      - run: |
          git config user.name "sgw-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f gallery.html sgw_data.json sgw_raw_sample.json
          git commit -m "Daily auction refresh" || echo "Nothing new to commit"
          git push
