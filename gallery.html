    var LISTINGS = Array.isArray(LISTINGS_RAW) ? LISTINGS_RAW : [];

    var grid = document.getElementById('grid');
    var sortBy = document.getElementById('sortBy');
    var searchBox = document.getElementById('searchBox');
    var countPill = document.getElementById('countPill');
    var emptyState = document.getElementById('emptyState');

    function text(str) {
      // Safe text node helper (no HTML injection, no escaping needed)
      return document.createTextNode(str == null ? '' : String(str));
    }

    function el(tag, className, children) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      (children || []).forEach(function (c) {
        if (c) node.appendChild(c);
      });
      return node;
    }

    function fmtMoney(n) {
      if (n === null || n === undefined || n === '') return '\u2014';
      var num = Number(n);
      if (isNaN(num)) return '\u2014';
      return '$' + num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function fmtEndTime(iso) {
      if (!iso) return { text: 'Unknown', soon: false };
      var end = new Date(iso);
      if (isNaN(end.getTime())) return { text: 'Unknown', soon: false };
      var now = new Date();
      var diffHrs = (end.getTime() - now.getTime()) / (1000 * 60 * 60);
      var dateText = end.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
        ', ' + end.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      return { text: dateText, soon: diffHrs > 0 && diffHrs < 24 };
    }

    function buildCard(item) {
      var card = document.createElement('a');
      card.className = 'card';
      card.href = item.url || '#';
      card.target = '_blank';
      card.rel = 'noopener';

      if (item.image) {
        var img = document.createElement('img');
        img.src = item.image;
        img.alt = '';
        img.loading = 'lazy';
        img.addEventListener('error', function () {
          var placeholder = el('div', 'no-image', [text('No photo')]);
          img.replaceWith(placeholder);
        });
        card.appendChild(img);
      } else {
        card.appendChild(el('div', 'no-image', [text('No photo')]));
      }

      var body = el('div', 'card-body');

      var title = el('p', 'card-title', [text(item.title || 'Untitled listing')]);
      body.appendChild(title);

      var priceRow = el('div', 'card-row', [
        el('span', 'price', [text(fmtMoney(item.current_price))]),
        el('span', null, [text((item.bid_count || 0) + ' bid' + (item.bid_count === 1 ? '' : 's'))]),
      ]);
      body.appendChild(priceRow);

      var endInfo = fmtEndTime(item.end_time);
      var endSpan = el('span', endInfo.soon ? 'ending-soon' : null, [
        text('Ends ' + endInfo.text + (endInfo.soon ? ' \u23F1' : '')),
      ]);
      body.appendChild(el('div', 'card-row', [endSpan]));

      card.appendChild(body);
      return card;
    }

    function render() {
      var sortVal = sortBy.value;
      var searchVal = searchBox.value.trim().toLowerCase();

      var items = LISTINGS.filter(function (l) {
        if (searchVal && (l.title || '').toLowerCase().indexOf(searchVal) === -1) return false;
        return true;
      });

      items.sort(function (a, b) {
        if (sortVal === 'end_asc') return (a.end_time || '9999') > (b.end_time || '9999') ? 1 : -1;
        if (sortVal === 'end_desc') return (a.end_time || '9999') < (b.end_time || '9999') ? 1 : -1;
        if (sortVal === 'price_asc') return (Number(a.current_price) || 0) - (Number(b.current_price) || 0);
        if (sortVal === 'price_desc') return (Number(b.current_price) || 0) - (Number(a.current_price) || 0);
        return 0;
      });

      grid.innerHTML = '';
      countPill.textContent = items.length + (items.length === 1 ? ' listing' : ' listings');
      emptyState.style.display = items.length ? 'none' : 'block';

      items.forEach(function (item) {
        grid.appendChild(buildCard(item));
      });
    }

    sortBy.addEventListener('change', render);
    searchBox.addEventListener('input', render);
    render();
  })();
